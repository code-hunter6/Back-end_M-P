services:
  db:
    image: postgres:16-alpine
    container_name: shopfast-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopfast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopfast}
      POSTGRES_DB: ${POSTGRES_DB:-shopfast}
    volumes:
      # Named volume, so data survives `docker compose down` (use `down -v` to wipe).
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Exposed only for local tools like pgAdmin/psql. Remove this in production.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopfast} -d ${POSTGRES_DB:-shopfast}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shopfast

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopfast-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PROJECT_NAME: ShopFast API
      API_V1_PREFIX: /api/v1
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Host is "db" (the service name), not localhost — inside the compose
      # network each service reaches the others by service name.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shopfast}:${POSTGRES_PASSWORD:-shopfast}@db:5432/${POSTGRES_DB:-shopfast}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-shopfast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopfast}
      POSTGRES_DB: ${POSTGRES_DB:-shopfast}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    volumes:
      # Live source mount + --reload for development. Drop both for production.
      - ./backend:/app
    entrypoint: ["/app/entrypoint.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    networks:
      - shopfast

  frontend:
    build:
      context: ./dropship-frontend
      dockerfile: Dockerfile
      args:
        # This is baked in at build time, so it must be the URL the BROWSER uses
        # (localhost:8000), not the internal service name "backend".
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        VITE_USE_MOCKS: "false"
        VITE_GA4_MEASUREMENT_ID: ${VITE_GA4_MEASUREMENT_ID:-}
        VITE_FB_PIXEL_ID: ${VITE_FB_PIXEL_ID:-}
    container_name: shopfast-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - shopfast

volumes:
  postgres_data:

networks:
  shopfast:
    driver: bridge
